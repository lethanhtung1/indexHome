<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nhạc</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--fg:#f3f1fb;--mute:#a9a6c4;--line:rgba(255,255,255,.13);--glass:rgba(255,255,255,.07);--hover:rgba(255,255,255,.09);--ac:#7fd8ff;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 600px at 0 0,#14507a 0,transparent 60%),radial-gradient(900px 700px at 100% 100%,#6e2d6a 0,transparent 60%),linear-gradient(135deg,#0f2f52,#2a2670 55%,#3a1f4d);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}
.hd{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 32px}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;letter-spacing:-.03em;min-width:170px}
.tabs{display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px)}
.nav{padding:11px 24px;border-radius:999px;font-weight:600;font-size:15px;color:var(--mute);transition:.2s;white-space:nowrap}
.nav:hover{color:var(--fg)}
.nav.on{background:#fff;color:#1a1740}
.nav .n{font-size:12px;opacity:.7;margin-left:4px}
.search{position:relative;width:240px;margin-left:auto;margin-right:0}
.hd .search{min-width:170px}
.search input{width:100%;padding:12px 16px 12px 42px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font:inherit;font-size:14px;backdrop-filter:blur(20px)}
.search svg{position:absolute;left:15px;top:13px;width:17px;height:17px;fill:var(--mute)}
.search input::placeholder{color:var(--mute)}

.layout{flex:1;min-height:0;display:grid;grid-template-columns:1fr 340px;gap:24px;padding:0 32px 112px}
.panel{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:34px;
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
main.panel{overflow-y:auto;padding:30px 34px}
.side{display:flex;flex-direction:column;gap:20px;min-height:0}
.card2{padding:24px}
.card2 h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
.lyr-card{flex:1;min-height:0;padding:0!important;overflow:hidden;position:relative}
.lyoff{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;display:none;gap:6px;align-items:center;padding:5px 8px;border-radius:999px;background:rgba(12,10,40,.6);border:1px solid var(--line);backdrop-filter:blur(12px);font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.lyoff.show{display:flex}
.lyoff button{padding:3px 9px;border-radius:999px;background:var(--hover);border:1px solid var(--line);font-size:12px;font-weight:600}
.lyoff button:hover{background:rgba(255,255,255,.16)}
.lyoff output{min-width:66px;text-align:center;color:var(--fg);font-variant-numeric:tabular-nums}
.lyr{position:relative;height:100%;overflow-y:auto;padding:30vh 26px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
.lyr::-webkit-scrollbar{display:none}
.lyr:has(>.hint){padding:24px;-webkit-mask-image:none;mask-image:none}
.ln{font-size:21px;font-weight:700;line-height:1.35;letter-spacing:-.01em;color:rgba(255,255,255,.32);padding:8px 0;cursor:pointer;transition:color .35s,transform .35s;transform-origin:left center}
.ln:hover{color:rgba(255,255,255,.65)}
.ln.on{color:#fff;transform:scale(1.04)}
.lyr.plain .ln{font-size:15px;font-weight:500;color:rgba(255,255,255,.75);padding:3px 0;cursor:default}
/* thanh cuộn tự ẩn, chỉ hiện mảnh khi rê chuột */
html,body,*{scrollbar-width:none!important;-ms-overflow-style:none!important}
*::-webkit-scrollbar,::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
.acts2{display:flex;gap:8px;align-items:center}
.arr{width:30px;height:30px;border-radius:50%;background:var(--hover);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;line-height:1;padding-bottom:2px}
.arr:hover{background:rgba(255,255,255,.16)}
@media (hover:none){.arr{display:none}}
.hint{color:var(--mute);font-size:14px;line-height:1.5;margin-top:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
#npCard{flex:none}
.npc{display:block;width:100%;aspect-ratio:16/10;border-radius:24px;overflow:hidden;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.npc img{width:100%;height:100%;object-fit:cover;display:block}
.npr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.npr h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npr p{color:var(--mute);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pill{padding:10px 20px;border-radius:999px;background:var(--hover);border:1px solid var(--line);font-weight:600;font-size:14px;flex:none}
.pill:hover{background:rgba(255,255,255,.15)}
.pill.liked{background:rgba(127,216,255,.18);color:var(--ac);border-color:rgba(127,216,255,.4)}
.hero{display:none;gap:28px;align-items:flex-end;margin-bottom:26px}
.hero.show{display:flex}
.hero .cover{width:188px;height:188px;border-radius:28px;overflow:hidden;flex:none;box-shadow:0 18px 40px rgba(0,0,0,.4);background:var(--hover);display:grid;place-items:center}
.hero .cover img{width:100%;height:100%;object-fit:cover}
.hero .cover.fav{background:linear-gradient(135deg,#ff5a8a,#7a5cff)}
.hero .cover svg{width:72px;height:72px;fill:#fff;stroke:#fff;stroke-width:1.5;stroke-linejoin:round}
.hero .tag{color:var(--mute);font-weight:600;font-size:14px;margin-bottom:6px}
.hero h2{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.04em;line-height:1.05;overflow-wrap:anywhere}
.hero p{color:var(--mute);margin:10px 0 18px}
.acts{display:flex;gap:10px;align-items:center}
.play{display:inline-flex;gap:10px;align-items:center;padding:14px 28px;border-radius:999px;background:#fff;color:#1a1740;font-weight:700;font-size:16px}
.play svg{width:16px;height:16px;fill:currentColor}
.rb{width:46px;height:46px;border-radius:50%;background:var(--hover);border:1px solid var(--line);display:grid;place-items:center}
.rb svg{width:19px;height:19px;fill:currentColor}
.rb.on{color:var(--ac)}
#msg{color:var(--mute);font-size:14px;margin-bottom:12px;min-height:18px}
#msg.err{color:#ff8fa8}

ul{list-style:none;padding:0}
li.row{display:grid;grid-template-columns:28px 46px 1fr auto 38px 38px 44px;gap:14px;align-items:center;padding:9px 14px;border-radius:18px;cursor:pointer}
li.row:hover{background:var(--hover)}
li.row.on{background:rgba(255,255,255,.12)}
.idx{text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
.row .art{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--hover)}
.row .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.on .t{color:var(--ac)}.row.on .idx{display:none}
.eq{display:none;gap:2px;align-items:flex-end;height:14px;justify-content:center}
.row.on .eq{display:flex}
.eq i{width:3px;background:var(--ac);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.dur{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.mood{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;background:rgba(12,10,40,.35);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.mood::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.heart{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none}
.heart svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.heart:hover{color:var(--fg);background:var(--hover)}
.heart.on{color:var(--ac)}.heart.on svg{fill:var(--ac);stroke:var(--ac);animation:pop .3s ease}
li.row .heart:not(.on){opacity:0}
li.row:hover .heart,li.row:focus-within .heart{opacity:1}
@media (hover:none){li.row .heart:not(.on){opacity:1}}
@keyframes pop{50%{transform:scale(1.3)}}
.empty{text-align:center;color:var(--mute);padding:72px 0;font-size:14px}
.empty b{display:block;font-size:19px;color:var(--fg);margin-bottom:6px}

#home{display:none}
.greet{font-size:15px;color:var(--mute);margin-bottom:24px}
.sec{margin-bottom:30px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sec-h h3{font-size:20px;font-weight:700;letter-spacing:-.02em;display:flex;gap:10px;align-items:center}
.sec-h .pill{padding:6px 14px;font-size:13px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:160px;gap:16px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.card{text-align:left;scroll-snap-align:start;min-width:0}
.card .cv{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;background:var(--hover);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.card .cv img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover .cv img{transform:scale(1.05)}
.card .pl{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:#fff;color:#1a1740;display:grid;place-items:center;opacity:0;transform:translateY(6px);transition:.2s}
.card .pl svg{width:16px;height:16px;fill:currentColor}
.card:hover .pl,.card:focus-visible .pl{opacity:1;transform:none}
@media (hover:none){.card .pl{opacity:1;transform:none}}
.card .t{font-size:14px;font-weight:600;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.card .a{font-size:12.5px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.on .t{color:var(--ac)}
.card.sk .cv{animation:sk 1.2s ease-in-out infinite}
.card.sk .t,.card.sk .a{height:12px;border-radius:6px;background:var(--hover);margin-top:10px;width:80%}
.card.sk .a{width:50%;height:10px}
@keyframes sk{50%{opacity:.5}}

.bar{position:fixed;left:32px;right:32px;bottom:20px;height:80px;padding:0 20px;display:grid;grid-template-columns:1fr minmax(280px,520px) 1fr;gap:20px;align-items:center;
  background:rgba(22,20,58,.62);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
  border:1px solid var(--line);border-radius:30px;z-index:5;box-shadow:0 16px 50px rgba(0,0,0,.35)}
.np{display:flex;gap:10px;align-items:center;min-width:0}
.np .open{display:flex;gap:12px;align-items:center;min-width:0;text-align:left;flex:1}
.np img{width:52px;height:52px;border-radius:14px;object-fit:cover;background:var(--hover);flex:none}
.np .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .a{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr{display:flex;flex-direction:column;gap:5px}
.btns{display:flex;justify-content:center;align-items:center;gap:22px}
.btns svg{width:22px;height:22px;fill:currentColor;display:block}
.btns .sm svg{width:18px;height:18px}
.btns .sm{color:var(--mute)}.btns .sm.on{color:var(--ac)}
.btns .pp{width:44px;height:44px;border-radius:50%;background:#fff;color:#1a1740;display:grid;place-items:center}
.btns .pp svg{width:20px;height:20px}
.prog{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.prog span{width:34px}.prog span:first-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;flex:1;cursor:pointer;background:linear-gradient(to right,var(--ac) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
input[type=range]:hover::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:0;height:0;border:0}
.vol{display:flex;gap:8px;align-items:center;justify-content:flex-end;color:var(--mute)}
.mixb{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--hover);font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.mixb.on{color:#1a1740;background:var(--ac);border-color:transparent}
.mixsel{background:var(--hover);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 8px;font:inherit;font-size:12.5px}
.mixsel option{color:#111}
.vol svg{width:18px;height:18px;fill:currentColor}.vol input{flex:none;width:100px}

.full{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom,0));overflow:hidden;background:linear-gradient(135deg,#0f2f52,#2a2670 55%,#3a1f4d)}
.full.open{display:flex}
/* nền trang = ảnh bìa bài đang phát, mờ và đổi dần khi chuyển bài */
.bgfx{position:fixed;inset:-80px;z-index:-1;pointer-events:none;background-size:cover;background-position:center;filter:blur(60px) saturate(1.5);opacity:0;transition:opacity 1.2s ease}
.bgfx.on{opacity:.6}
.full .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(80px) saturate(1.5);opacity:.5}
.full>*:not(.bg){position:relative}
.full .close{position:absolute;top:calc(18px + env(safe-area-inset-top,0));left:20px;width:42px;height:42px;border-radius:50%;background:var(--hover);display:grid;place-items:center}
.disc{width:min(74vw,360px,42vh);aspect-ratio:1;border-radius:50%;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.4);background:#0b0b0e;padding:7%;animation:spin 14s linear infinite}
.disc img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.disc::after{content:"";position:absolute;inset:0;margin:auto;width:9%;aspect-ratio:1;border-radius:50%;background:#1d2057;box-shadow:0 0 0 3px #0b0b0e}
.full.paused .disc{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.full .meta{width:min(78vw,380px);margin:28px 0 14px;display:flex;gap:12px;align-items:center}
.full .meta>div:first-child{flex:1;min-width:0}
.full .meta .t{font-size:22px;font-weight:800;letter-spacing:-.02em}
.full .meta .a{font-size:16px;color:var(--mute);margin-top:2px}
.full .ctr{width:min(78vw,380px)}
.full .btns{margin-top:14px}
.full .btns .pp{width:68px;height:68px}.full .btns .pp svg{width:30px;height:30px}
.full .btns svg{width:28px;height:28px}.full .btns .sm svg{width:20px;height:20px}

/* chế độ tập trung: khi phát bài, danh sách thu gọn về bên trái, thẻ đang phát + lời ra giữa; rê chuột vào cột trái để mở danh sách */
.rail{display:none}
@media (min-width:1001px) and (hover:hover){
  .layout{display:block;position:relative;padding:0}
  main.panel{position:absolute;left:32px;top:0;bottom:112px;width:calc(100% - 436px);z-index:4;
    transition:width .7s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
  .side{position:absolute;top:0;bottom:112px;left:calc(100% - 372px);width:340px;align-items:center;
    transition:left .7s cubic-bezier(.2,.8,.2,1),width .7s cubic-bezier(.2,.8,.2,1)}
  .side>*{width:100%;max-width:760px}
  body.focus main.panel{width:88px;overflow:hidden}
  body.focus main.panel>*:not(.rail){width:calc(min(760px,70vw) - 68px);opacity:0;pointer-events:none;transition:opacity .2s}
  body.focus:not(.nohover) main.panel:hover{width:min(760px,70vw);overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.55);background:linear-gradient(160deg,rgba(34,30,88,.94),rgba(26,22,70,.92))}
  body.focus:not(.nohover) main.panel:hover>*:not(.rail){opacity:1;pointer-events:auto;transition:opacity .3s .25s}
  body.focus .rail{display:flex;position:absolute;inset:0 auto 0 0;width:88px;flex-direction:column;align-items:center;gap:12px;padding:18px 0;transition:opacity .25s .1s}
  body.focus:not(.nohover) main.panel:hover .rail{opacity:0;pointer-events:none;transition:opacity .15s}
  .rail .rh{width:40px;height:40px;display:grid;place-items:center;color:var(--mute);flex:none}
  .rail .rl{width:52px;height:52px;flex:none;border-radius:14px;overflow:hidden;padding:0;opacity:.55;transition:opacity .2s,transform .2s}
  .rail .rl img{width:100%;height:100%;object-fit:cover;display:block}
  .rail .rl:hover{opacity:1;transform:scale(1.07)}
  .rail .rl.on{opacity:1;outline:2px solid var(--ac);outline-offset:2px}
  body.focus .side{left:144px;width:calc(100% - 288px)} /* hai bên cùng chừa 144px nên thẻ + lời nằm chính giữa trang */
  body.focus #npCard{display:flex;gap:20px;align-items:center}
  body.focus .npc{width:140px;flex:none;margin:0;aspect-ratio:1}
  body.focus .npr{flex:1;min-width:0}
  body.focus .ln{font-size:30px}
}
@media (max-width:1000px){
  .mixsel{display:none}.vol input[type=range]{width:70px}
  .layout{grid-template-columns:1fr}.side{display:none}
  .hd{flex-wrap:wrap;padding:16px 16px 12px}.logo{min-width:0}.search{width:100%;order:3;margin:0}
  .tabs{margin-left:auto}.nav{padding:9px 14px;font-size:14px}
}
@media (max-width:640px){
  .layout{padding:0 12px 100px}main.panel{padding:20px 16px;border-radius:26px}
  .hero{flex-direction:column;align-items:flex-start;gap:16px}.hero .cover{width:120px;height:120px}
  li.row{grid-template-columns:24px 46px 1fr 38px 38px}.row .mood,.row .dur{display:none}
  .shelf{grid-auto-columns:138px;gap:12px}
  .bar{left:12px;right:12px;bottom:12px;grid-template-columns:1fr auto;height:70px;padding:0 12px;border-radius:24px}
  .bar .ctr .prog,.bar .vol,.bar .btns .sm,.bar .btns .prv{display:none}
  .np img{width:46px;height:46px}.btns{gap:14px}.btns .pp{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.acct{padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass);color:var(--fg);font-weight:600;font-size:14px;white-space:nowrap;backdrop-filter:blur(20px);cursor:pointer}
.acct:hover{background:var(--hover)}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,8,30,.6);backdrop-filter:blur(6px)}
.modal[hidden]{display:none}
.modal .box{width:min(380px,92vw);padding:28px;border-radius:24px;border:1px solid var(--line);background:#25205a;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0 0 4px;font-size:22px}
.modal input{padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--fg);font:inherit;font-size:15px}
.modal .go{padding:13px;border-radius:999px;background:#fff;color:#1a1740;font-weight:700;font-size:15px;cursor:pointer}
.modal .go:disabled{opacity:.6}
.modal .sw{font-size:13px;color:var(--mute);text-align:center}
.modal .sw a{color:var(--ac);cursor:pointer}
.modal .er{min-height:18px;font-size:13px;color:#ff8f8f}
.addpl{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex:none;font-size:22px;line-height:1;cursor:pointer}
.addpl:hover{color:var(--fg);background:var(--hover)}
li.row .addpl{opacity:0}

<script>
const API = "https://nhaccuatung.onrender.com";
const $ = id => document.getElementById(id);
/* ===== Phát bằng YouTube IFrame Player (chạy ngay trên trình duyệt, không qua IP server) =====
   Lớp YTAudio giả lập giao diện thẻ <audio> nên phần automix, lời bài hát, thanh tua... giữ nguyên */
let ytReady = false; const ytWait = [];
window.onYouTubeIframeAPIReady = () => { ytReady = true; ytWait.splice(0).forEach(f => f()); };
(() => { const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc); })();
class YTAudio {
  constructor(id) {
    const box = document.createElement("div"); box.id = id;
    const wrap = document.createElement("div");
    wrap.style.cssText = "position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:.01;pointer-events:none;z-index:-1;overflow:hidden";
    wrap.appendChild(box); document.body.appendChild(wrap);
    this._src = null; this._vid = null; this._vol = 1; this._want = false; this._ended = false; this._ready = false; this._cmds = []; this.p = null;
    const init = () => { this.p = new window.YT.Player(id, {
      width: "200", height: "200",
      playerVars: Object.assign({ playsinline: 1, controls: 0, disablekb: 1, fs: 0, rel: 0 }, /^https?:/.test(location.protocol) ? { origin: location.origin } : {}),
      events: {
        onReady: () => { this._ready = true; this._cmds.splice(0).forEach(f => f()); },
        onStateChange: e => this._state(e.data),
        onError: e => { this._want = false; if (this === audio) say("Không phát được bài này (lỗi YouTube " + e.data + "), thử bài khác.", true); }
      } }); };
    ytReady ? init() : ytWait.push(init);
    setInterval(() => { if (this._ready && this._want && this._vid) this.ontimeupdate && this.ontimeupdate(); }, 250);
  }
  _do(f) { this._ready ? f() : this._cmds.push(f); }
  _state(st) {
    if (st === 5) this._cued = this._vid;
    if (st === 1) { this.started = true; this._want = true; this._ended = false; this.onplay && this.onplay(); this.onplaying && this.onplaying(); }
    else if (st === 2) { this._want = false; this.onpause && this.onpause(); }
    else if (st === 0) { this._want = false; this._ended = true; this.onended && this.onended(); }
  }
  set src(v) {
    const m = /\/stream\/([\w-]+)/.exec(v || ""); this._src = v; this.started = false; this._ended = false; this._want = false; this._vid = m ? m[1] : null;
    this._cued = null;
  }
  get src() { return this._src; }
  getAttribute() { return this._src; }
  removeAttribute() { this._src = null; this._vid = null; this._want = false; this._do(() => this.p.stopVideo()); }
  load() { const id = this._vid; if (id) this._do(() => { if (this._vid === id) this.p.cueVideoById(id); }); }
  play() { this._want = true; this._ended = false; const id = this._vid; this._do(() => { this.p.setVolume(Math.round(this._vol * 100)); if (!id) this.p.playVideo(); else if (this._cued === id) this.p.playVideo(); else this.p.loadVideoById(id); }); return Promise.resolve(); }
  pause() { this._want = false; this._do(() => this.p.pauseVideo()); }
  get paused() { return !this._want; }
  get ended() { return this._ended; }
  get volume() { return this._vol; }
  set volume(v) { this._vol = v; this._do(() => this.p.setVolume(Math.round(v * 100))); }
  get currentTime() { return this._ready && this._vid ? (this.p.getCurrentTime() || 0) : 0; }
  set currentTime(t) { this._do(() => this.p.seekTo(t, true)); }
  get duration() { return this._ready && this._vid ? (this.p.getDuration() || 0) : 0; }
}
const A = [new YTAudio("yt1"), new YTAudio("yt2")]; let audio = A[0];
const results = $("results"), msg = $("msg");
let tracks = [], queue = [], cur = -1, playingId = null, view = "home", shuffle = false, repeat = false, lastQ = "";
/* ===== Nhiều danh sách phát. lists[0] (id "fav") là danh sách trái tim "Yêu thích" ===== */
const newList = (id, name, items) => ({ id, name, items: items || [] });
const trackLite = t => ({ id: t.id, title: t.title, artist: t.artist || "", mood: t.mood, duration: t.duration });
function normLists(arr) {
  const out = [], seen = new Set();
  for (const L of Array.isArray(arr) ? arr : []) {
    if (!L || typeof L.id !== "string" || seen.has(L.id)) continue;
    seen.add(L.id);
    out.push(newList(L.id, String(L.name || "Danh sách").slice(0, 60), Array.isArray(L.items) ? L.items.filter(t => t && t.id) : []));
  }
  if (!seen.has("fav")) out.unshift(newList("fav", "Yêu thích"));
  out.sort((a, b) => (b.id === "fav") - (a.id === "fav"));
  return out;
}
function mergeLists(server, local) {
  const res = normLists(JSON.parse(JSON.stringify(server)));
  for (const L of normLists(local)) {
    const S = res.find(x => x.id === L.id);
    if (S) { const have = new Set(S.items.map(t => t.id)); L.items.forEach(t => { if (!have.has(t.id)) S.items.push(t); }); }
    else if (L.items.length) res.push(L);
  }
  return res;
}
let lists = [];
try { lists = JSON.parse(localStorage.getItem("nhac.lists") || "null") || []; } catch (e) {}
if (!lists.length) { /* chuyển từ bản cũ chỉ có 1 danh sách (cũ lưu bài mới nhất ở đầu) */
  let old = []; try { old = JSON.parse(localStorage.getItem("nhac.favs") || "[]"); } catch (e) {}
  lists = [newList("fav", "Yêu thích", old.slice().reverse())];
}
lists = normLists(lists);
let curListId = "fav", queueSrc = null;
const curList = () => lists.find(l => l.id === curListId) || lists[0];
const inList = (L, id) => !!L && L.items.some(t => t.id === id);
const isFav = id => inList(lists[0], id);
const saveFavs = () => { try { localStorage.setItem("nhac.lists", JSON.stringify(lists)); } catch (e) {} pushFavs(); };
/* hàng đợi bám theo danh sách đang phát: thêm/xóa bài thì hàng đợi cập nhật theo, bài thêm vào cuối sẽ được phát tiếp */
function syncQueue() {
  if (!queueSrc) return;
  const L = lists.find(l => l.id === queueSrc);
  if (!L) { queueSrc = null; return; }
  const curT = queue[cur], prev = cur, q = L.items.slice();
  let ci = curT ? q.findIndex(t => t.id === curT.id) : -1;
  if (curT && ci < 0) { ci = Math.min(Math.max(prev, 0), q.length); q.splice(ci, 0, curT); } /* bài đang nghe vừa bị xóa khỏi danh sách: cứ để nghe nốt */
  queue = q; cur = ci < 0 ? 0 : ci; planned = null; pre = null;
  renderRail();
}

const MOODS = { "Năng lượng": "#ffb25b", "Thư giãn": "#6fe0b0", "Đêm khuya": "#7fd8ff", "Man mác": "#8fa2ff", "Tập trung": "#ff8fc7", "Dành cho bạn": "#ffa7d6" };
const SECTIONS = [
  { title: "Năng lượng", q: "nhạc trẻ việt hay nhất mv" },
  { title: "Thư giãn", q: "lofi chill song" },
  { title: "Đêm khuya", q: "nhạc đêm khuya buồn mv" },
  { title: "Man mác", q: "ballad việt mv" },
  { title: "Tập trung", q: "piano nhạc không lời" },
];
const fmt = s => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}` : "0:00";
const art = (id, q="hqdefault") => `https://i.ytimg.com/vi/${id}/${q}.jpg`;
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const say = (t, err) => { msg.textContent = t; msg.className = err ? "err" : ""; };
const fill = el => el.style.setProperty("--p", (el.value / (el.max || 1)) * 100 + "%");
let secs = [], homeLoaded = false;
const list = () => view === "fav" ? curList().items : view === "home" ? secs.flatMap(s => s.items || []) : tracks;
const heartSvg = `<svg><use href="#i-heart"/></svg>`;
const moodPill = n => n ? `<span class="mood" style="--c:${MOODS[n] || "#fff"}">${esc(n)}</span>` : `<span></span>`;

function renderPlBar() {
  let bar = $("plBar");
  if (!bar) { bar = document.createElement("div"); bar.id = "plBar"; bar.className = "plbar"; $("hero").before(bar); bar.addEventListener("click", plBarClick); }
  bar.style.display = view === "fav" ? "" : "none";
  if (view !== "fav") return;
  const cl = curList();
  bar.innerHTML = lists.map(L => `<button class="chip${L.id === cl.id ? " on" : ""}" data-l="${esc(L.id)}">${esc(L.name)}<small>${L.items.length}</small></button>`).join("")
    + `<button class="chip add" data-new="1">＋ Tạo mới</button>`
    + (cl.id !== "fav" ? `<span class="plact"><button data-ren="1">Đổi tên</button><button data-del="1">Xóa</button></span>` : "");
}
function createList(name, firstTrack) {
  name = (name || "").trim().slice(0, 60);
  if (!name) return null;
  if (lists.length >= 30) { say("Tối đa 30 danh sách.", true); return null; }
  const L = newList("l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name);
  if (firstTrack) L.items.push(trackLite(firstTrack));
  lists.push(L); saveFavs();
  return L;
}
function plBarClick(e) {
  const c = e.target.closest("[data-l]");
  if (c) { curListId = c.dataset.l; return render(); }
  if (e.target.closest("[data-new]")) { const L = createList(prompt("Tên danh sách mới:")); if (L) { curListId = L.id; render(); } return; }
  const L = curList();
  if (e.target.closest("[data-ren]")) {
    const n = (prompt("Đổi tên danh sách:", L.name) || "").trim().slice(0, 60);
    if (n) { L.name = n; saveFavs(); render(); }
  } else if (e.target.closest("[data-del]")) {
    if (L.id !== "fav" && confirm(`Xóa danh sách "${L.name}"? Các bài trong đó không bị xóa khỏi nơi khác.`)) {
      lists = lists.filter(x => x.id !== L.id); curListId = "fav"; if (queueSrc === L.id) queueSrc = null;
      saveFavs(); render(); syncHearts();
    }
  }
}

function render() {
  renderPlBar();
  $("favN").textContent = lists.length;
  const l = list();
  const hero = view === "fav" || (view === "search" && l.length);
  $("hero").classList.toggle("show", !!hero);

let master = 1, mixOn = ls("nhac.mix") !== "0", mixSec = +ls("nhac.mixSec") || 6;
let oldEl = null, fade = null, timer = null, pre = null, planned = null, pendingDur = 3;

function tick() {
  if (!fade) return;

  if (oldEl) oldEl.volume = master * Math.cos(p * Math.PI / 2);
  if (p >= 1) endFade();
}
function killOld() { if (oldEl) { oldEl.pause(); oldEl.removeAttribute("src"); oldEl.load(); oldEl = null; } }
function endFade() { clearInterval(timer); fade = null; audio.volume = master; killOld(); }
function pickNext() {
  if (planned == null) {

    else planned = (cur + 1) % queue.length;
  }
  return planned;
}
function preload() {

}
let mixBroken = false;

  const rem = d - audio.currentTime;

let bgSide = 0;

const mainPanel = document.querySelector("main.panel");

}

function play(i, from, auto) {
  if (from) { queue = from.slice(); queueSrc = (view === "fav" && from === curList().items) ? curList().id : null; }
  if (!queue.length) return;
  cur = (i + queue.length) % queue.length;
  const t = queue[cur]; playingId = t.id;
  if (fade) endFade();
  const was = audio, mixing = !!auto && mixOn && !mixBroken && !was.paused && !was.ended && was.currentTime > 0.5;
  if (mixing) { oldEl = was; audio = other(); }
  if (!(mixing && pre && pre.id === t.id)) audio.src = `${API}/stream/${t.id}`;
  pre = null; planned = null;

    nw.removeAttribute("src"); audio = good; audio.volume = master; audio.src = `${API}/stream/${id}`; audio.play();

/* lời bài hát (lấy qua backend) */
let lyrics = [], lyIdx = -1, lyPlain = false, lyOff = 0, lyTouched = false, lyList = [], lyAltI = 0;

  const sv = ls("nhac.lo." + playingId), gd = (b.videoDuration && b.lrcDuration) ? b.videoDuration - b.lrcDuration : 0;
  /* chưa chỉnh bao giờ: nếu video dài hơn bản lời 5-25s thì đoán là có đoạn intro và tự đặt sẵn */
  lyOff = lyPlain ? 0 : (sv !== null ? (parseFloat(sv) || 0) : (gd >= 5 && gd <= 25 ? Math.round(gd * 2) / 2 : 0)); showOff();
  lyTouched = false; if (!lyPlain && sv === null) autoOffset(playingId);
  lyr.innerHTML = lyrics.map((l, i) => `<p class="ln" data-i="${i}">${esc(l.s)}</p>`).join("");
  lyr.scrollTop = 0;
}
function syncLyrics() {
  if (!lyrics.length || lyPlain) return;
  const t = audio.currentTime - lyOff; let i = -1;
  for (let k = 0; k < lyrics.length && lyrics[k].t <= t; k++) i = k;
  if (i === lyIdx) return;
  lyIdx = i;
  lyr.querySelector(".ln.on")?.classList.remove("on");
  const el = lyr.children[i]; if (!el) return;
  el.classList.add("on");
  lyr.scrollTo({ top: el.offsetTop - lyr.clientHeight / 2 + el.offsetHeight / 2, behavior: "smooth" });
}
/* tự canh: server so lời với phụ đề của video rồi trả về độ lệch */
async function autoOffset(id) {
  try {
    const r = await fetch(`${API}/offset/${id}`); if (!r.ok) return;
    const b = await r.json();
    if (playingId !== id || lyTouched || b.offset == null) return;
    lyOff = b.offset; lset("nhac.lo." + id, lyOff); showOff(); lyIdx = -2; syncLyrics();
  } catch (e) {}
}
function showAlt() {
  const b = $("lyAlt"), n = lyList.length, x = lyList[lyAltI] || {};
  b.style.display = n > 1 ? "" : "none";
  b.textContent = `⇄ Bản ${lyAltI + 1}/${n}`;
  b.title = `${x.trackName || ""} ${x.artistName ? "– " + x.artistName : ""} (${x.lrcDuration ? Math.floor(x.lrcDuration / 60) + ":" + String(Math.round(x.lrcDuration % 60)).padStart(2, "0") : "?"}). Bấm để đổi sang bản lời khác.`;
}
$("lyAlt").onclick = () => {
  if (lyList.length < 2) return;
  lyAltI = (lyAltI + 1) % lyList.length; lset("nhac.la." + playingId, lyAltI);
  try { localStorage.removeItem("nhac.lo." + playingId); } catch (e) {}
  showLyrics(lyList[lyAltI]); showAlt();
};
/* chỉnh lệch lời: + = lời hiện muộn hơn, − = lời hiện sớm hơn; nhớ riêng cho từng bài */
function showOff() {
  $("lyoff").classList.toggle("show", !lyPlain && lyrics.length > 0);
  $("lyV").textContent = lyOff === 0 ? "khớp" : (lyOff > 0 ? "muộn " : "sớm ") + Math.abs(lyOff).toFixed(1) + "s";
}
function setOff(v) { lyTouched = true; lyOff = Math.max(-60, Math.min(60, Math.round(v * 10) / 10)); lset("nhac.lo." + playingId, lyOff); showOff(); lyIdx = -2; syncLyrics(); }
$("lyP").onclick = () => setOff(lyOff + .5);
$("lyM").onclick = () => setOff(lyOff - .5);
$("lyMM").onclick = () => setOff(lyOff - 5);
$("lyPP").onclick = () => setOff(lyOff + 5);
$("lyR").onclick = () => { lyOff = 0; try { localStorage.removeItem("nhac.lo." + playingId); } catch (e) {} lyTouched = false; showOff(); lyIdx = -2; syncLyrics(); autoOffset(playingId); }; /* ↺ = xoá và tự canh lại */
setInterval(() => { if (!audio.paused) syncLyrics(); }, 100); /* timeupdate chỉ ~4 lần/giây nên lời bị trễ nhịp */
lyr.addEventListener("click", e => { const p = e.target.closest(".ln"); if (p && !lyPlain) audio.currentTime = lyrics[+p.dataset.i].t; });

const nextTrack = auto => { if (queue.length) play(pickNext(), undefined, auto === true); };
const prevTrack = () => audio.currentTime > 3 ? (audio.currentTime = 0) : play(cur - 1);
const toggle = () => cur < 0 ? play(0, list()) : (audio.paused ? (audio.play(), oldEl && oldEl.play()) : (audio.pause(), oldEl && oldEl.pause()));

["play", "fPlay"].forEach(id => $(id).onclick = toggle);
["next", "fNext"].forEach(id => $(id).onclick = nextTrack);
["prev", "fPrev"].forEach(id => $(id).onclick = prevTrack);
["shuf", "fShuf"].forEach(id => $(id).onclick = () => { shuffle = !shuffle; ["shuf", "fShuf"].forEach(x => $(x).classList.toggle("on", shuffle)); });
["rep", "fRep"].forEach(id => $(id).onclick = () => { repeat = !repeat; ["rep", "fRep"].forEach(x => $(x).classList.toggle("on", repeat)); });
$("vol").oninput = e => { master = +e.target.value; if (!fade) audio.volume = master; fill(e.target); };
$("mix").classList.toggle("on", mixOn); $("mixSec").value = mixSec;
$("mix").onclick = () => { mixOn = !mixOn; $("mix").classList.toggle("on", mixOn); lset("nhac.mix", mixOn ? "1" : "0"); };
$("mixSec").onchange = e => { mixSec = +e.target.value; lset("nhac.mixSec", mixSec); };

const icon = p => ["play", "fPlay"].forEach(id => $(id).firstElementChild.firstElementChild.setAttribute("href", p ? "#i-pause" : "#i-play"));
function wire(el) {
  el.onplay = () => { if (el !== audio) return; icon(true); document.body.classList.remove("paused"); $("full").classList.remove("paused"); };
  el.onpause = () => { if (el !== audio) return; icon(false); document.body.classList.add("paused"); $("full").classList.add("paused"); };
  el.onplaying = () => { if (el !== audio) return; say(""); if (oldEl && !fade) beginFade(); };
  el.onerror = () => { if (el !== audio || !el.getAttribute("src")) return; say("Không phát được bài này, thử bài khác.", true); killOld(); };
  el.onended = () => { if (el !== audio) return; repeat ? (el.currentTime = 0, el.play()) : nextTrack(); };
  el.ontimeupdate = () => {
    if (el !== audio) return;
    syncLyrics();
    const d = el.duration || 0;
    for (const [s, c, u] of [["seek", "cur", "dur"], ["fSeek", "fCur", "fDur"]]) {
      $(s).max = d; if (!$(s).dataset.drag) $(s).value = el.currentTime;
      fill($(s)); $(c).textContent = fmt(el.currentTime); $(u).textContent = fmt(d);
    }
    automixCheck(d);
  };
}
A.forEach(wire);
["seek", "fSeek"].forEach(id => {
  const el = $(id);
  el.oninput = () => { el.dataset.drag = 1; fill(el); };
  el.onchange = () => { audio.currentTime = el.value; delete el.dataset.drag; };
});

$("npOpen").onclick = () => cur >= 0 && $("full").classList.add("open");
$("close").onclick = () => $("full").classList.remove("open");
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("full").classList.remove("open");
  if (e.code === "Space" && !/INPUT|BUTTON/.test(document.activeElement.tagName) && !document.activeElement.classList.contains("row")) { e.preventDefault(); toggle(); }
});

if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("nexttrack", nextTrack);
  navigator.mediaSession.setActionHandler("previoustrack", prevTrack);
}
document.body.classList.add("paused"); $("full").classList.add("paused");
setView("home"); renderSide(); lyMsg("Phát một bài để xem lời bài hát.");
</script>
